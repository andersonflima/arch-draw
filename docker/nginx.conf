limit_req_zone $binary_remote_addr zone=api_rate:10m rate=20r/s;

server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 2m;
  client_body_timeout 10s;
  send_timeout 10s;
  keepalive_timeout 15s;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_http_version 1.1;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; form-action 'self'" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # HSTS is honoured only over HTTPS, so it is inert for local/plain-HTTP access while
  # forcing HTTPS for the production domain. No includeSubDomains/preload to avoid
  # committing sibling subdomains.
  add_header Strict-Transport-Security "max-age=31536000" always;

  location /api/ {
    limit_req zone=api_rate burst=40 nodelay;
    proxy_pass http://api:3333/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  location ~* \.(?:js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

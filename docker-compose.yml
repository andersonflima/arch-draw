services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3333
      DATABASE_PATH: /app/data/arch-draw.sqlite
      WEB_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - arch_draw_data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  arch_draw_data:
